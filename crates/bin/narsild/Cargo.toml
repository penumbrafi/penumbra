[workspace]

[package]
name = "narsild"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "narsild"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
osst = { git = "https://github.com/penumbrafi/frostito", rev = "20ff2e37a488a54e0b0b581b0c9c4af566290de6", default-features = false, features = ["std", "pallas"] }
# must be the same pasta instance osst's pallas backend uses
pasta_curves = { package = "zakura-pasta-curves", version = "=1.0.0" }
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
