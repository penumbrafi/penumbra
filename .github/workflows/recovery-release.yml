name: recovery-release

# The release workflow of this repository. Builds every workspace binary from
# the tagged source for linux x86_64 and aarch64 and, on a version tag (or a
# manual run naming a tag), publishes them as a GitHub Release together with
# the reference restart genesis and a combined SHA256SUMS.
#
# No other workflow reacts to a tag, and releases are never created by hand.
#
# The binaries are a convenience. The real cross-check is what your own build
# reproduces: `cargo build --release --locked` on the tag, and for the restart
# path the genesis sha256 that your own `pd migrate-restart` produces.

on:
  push:
    tags:
      - 'recovery-*'
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (blank = build only, no release)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: recovery-release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  GENESIS_SHA256: c099ccb02a2136d5071fb22b1511eeec1588ad09676e0a0532d072f28b433ed4
  # Every workspace binary. A target that cannot build one of these still
  # ships the rest; the release notes list what is missing.
  BINARIES: pd pcli pclientd pindexer pmonitor elcuity

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-gnu
            runner: ubuntu-22.04      # glibc 2.35: portable down to older hosts
          - target: aarch64-linux-gnu
            runner: ubuntu-24.04-arm  # native arm build, free GH-hosted runner
    runs-on: ${{ matrix.runner }}
    steps:
      # On a manual run, build the named tag rather than the branch the
      # workflow file came from, so a release can be rebuilt without moving it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          lfs: true         # pd build.rs embeds assets/minifront.zip (LFS)

      # Build deps, matching deployments/containerfiles/Dockerfile. No protoc:
      # the proto crate ships generated code.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev clang

      # Honors rust-toolchain.toml and caches the build.
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true
          cache-key: ${{ matrix.target }}

      - name: Build all binaries (release, locked)
        id: build
        run: |
          set -uo pipefail
          BUILT=""
          SKIPPED=""
          for b in $BINARIES; do
            echo "::group::cargo build --release --locked -p $b"
            if cargo build --release --locked -p "$b"; then
              BUILT="$BUILT $b"
            else
              echo "::warning::$b failed to build on ${{ matrix.target }}, excluding it"
              SKIPPED="$SKIPPED $b"
            fi
            echo "::endgroup::"
          done
          echo "built=${BUILT# }"     >> "$GITHUB_OUTPUT"
          echo "skipped=${SKIPPED# }" >> "$GITHUB_OUTPUT"
          # pd is the one binary this release cannot ship without.
          case " $BUILT " in *" pd "*) ;; *) echo "pd failed to build"; exit 1 ;; esac

      - name: Verify versions and pd subcommands
        run: |
          set -euo pipefail
          # The version the tagged source declares; every binary must agree.
          WANT="$(sed -n 's/^version *= *"\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          echo "workspace version: $WANT"
          for b in ${{ steps.build.outputs.built }}; do
            GOT="$("target/release/$b" --version | awk '{print $2}')"
            echo "  $b: $GOT"
            [ "$WANT" = "$GOT" ] || { echo "$b version does not match Cargo.toml"; exit 1; }
          done
          # If this is a vX.Y.Z tag, it must name the same version.
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          case "$REF" in
            v*) [ "${REF#v}" = "$WANT" ] || { echo "tag $REF does not match $WANT"; exit 1; } ;;
          esac
          target/release/pd migrate-restart --help >/dev/null 2>&1 || { echo "migrate-restart missing"; exit 1; }
          target/release/pd migrate prune --help   >/dev/null 2>&1 || { echo "migrate prune missing"; exit 1; }
          echo "OK: pd $WANT with migrate-restart and migrate prune"

      - name: Package
        id: pkg
        run: |
          set -euo pipefail
          VER="$(target/release/pd --version | awk '{print $2}')"
          T="${{ matrix.target }}"
          mkdir -p dist
          for b in ${{ steps.build.outputs.built }}; do
            NAME="$b-$VER-$T"
            mkdir -p "stage/$NAME"
            cp "target/release/$b" "stage/$NAME/$b"
            cp CHANGELOG.md "stage/$NAME/" 2>/dev/null || true
            [ "$b" = "pd" ] && cp docs/pruning.md "stage/$NAME/" 2>/dev/null || true
            tar -C stage -czf "dist/$NAME.tar.gz" "$NAME"
          done

          # Bare pd for compatibility with the v2.0.9 asset layout, x86_64 only.
          if [ "$T" = "x86_64-linux-gnu" ]; then
            cp target/release/pd dist/pd
            cp restart/candidate-genesis-penumbra-1-restart-12598602-disable.json dist/
            GOT="$(sha256sum dist/candidate-genesis-penumbra-1-restart-12598602-disable.json | awk '{print $1}')"
            [ "$GOT" = "$GENESIS_SHA256" ] || { echo "shipped genesis sha mismatch: $GOT"; exit 1; }
            echo "genesis matches published hash"
          fi

          ( cd dist && sha256sum * > "../SHA256SUMS.$T" )
          mv "SHA256SUMS.$T" dist/
          echo "--- SHA256SUMS.$T ---"; cat "dist/SHA256SUMS.$T"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/

      - name: Record exclusions
        run: |
          mkdir -p meta
          echo "${{ steps.build.outputs.skipped }}" > "meta/skipped-${{ matrix.target }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: meta-${{ matrix.target }}
          path: meta/

  publish:
    needs: build
    if: ${{ always() && (github.event_name == 'push' || github.event.inputs.tag != '') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: incoming
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: meta-*
          path: meta
          merge-multiple: true

      - name: Assemble the combined SHA256SUMS
        id: sums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp incoming/* dist/ 2>/dev/null || true
          rm -f dist/SHA256SUMS.*
          ( cd dist && sha256sum * > ../SHA256SUMS )
          mv SHA256SUMS dist/
          echo "--- SHA256SUMS ---"; cat dist/SHA256SUMS
          VER="$(sed -n 's/^version *= *"\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Publish or update the GitHub Release
        env:
          # The built-in token cannot create releases in this repository;
          # RELEASE_TOKEN is a repo secret with contents:write.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          VER: ${{ steps.sums.outputs.ver }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"

          # Release notes are the CHANGELOG section for this version, reviewable
          # in the tagged source. Nothing is written by hand at publish time.
          awk -v ver="$VER" '
            $0 == "## " ver { inside = 1; next }
            inside && /^## / { exit }
            inside { print }
          ' CHANGELOG.md > "$NOTES"
          [ -s "$NOTES" ] || { echo "no CHANGELOG.md section for $VER"; exit 1; }

          # Note any binary a target could not build.
          for f in meta/skipped-*.txt; do
            [ -e "$f" ] || continue
            T="$(basename "$f" .txt)"; T="${T#skipped-}"
            S="$(tr -d '\n' < "$f")"
            [ -n "$S" ] && printf '\n> Not built for `%s`: `%s`.\n' "$T" "$S" >> "$NOTES"
          done

          printf '\n---\n\nBuilt by GitHub Actions from `%s`. Verify a download against `SHA256SUMS`:\n\n```sh\nsha256sum -c --ignore-missing SHA256SUMS\n```\n\nFull source diff: https://github.com/penumbrafi/penumbra/compare/v2.0.9...%s\n' "$TAG" "$TAG" >> "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$NOTES" --title "pd $VER"
          else
            gh release create "$TAG" --target "${{ github.sha }}" \
              --title "pd $VER" --notes-file "$NOTES"
          fi
          gh release upload "$TAG" --clobber dist/*
          gh release view "$TAG" --json assets --jq '.assets[].name'
