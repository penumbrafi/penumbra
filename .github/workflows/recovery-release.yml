name: recovery-release

# Builds the pd `migrate-restart` binary for the penumbra-1 recovery and, on a
# tag (or a manual run with a tag), publishes it as a GitHub Release alongside
# the reference genesis, checksums and operator script.
#
# The binary is a convenience. The real cross-check for operators is the genesis
# sha256 that their own `pd migrate-restart` reproduces
# (2fa8384ff30dc5a9d6eaf3f50b80b98bef6d95c67d7cc674354b1df1d2787b1b), not this
# artifact. Anyone can rebuild from source and sha-match instead of trusting it.

on:
  push:
    tags:
      - 'recovery-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (blank = build only, no release)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: recovery-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04   # glibc 2.35: portable down to older hosts than bookworm
    env:
      GENESIS_SHA256: 2fa8384ff30dc5a9d6eaf3f50b80b98bef6d95c67d7cc674354b1df1d2787b1b
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true         # pd build.rs embeds assets/minifront.zip (LFS)

      # Build deps, matching deployments/containerfiles/Dockerfile. No protoc:
      # the proto crate ships generated code.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev clang

      # Honors rust-toolchain.toml (1.83) and caches the build.
      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Build pd (release, locked)
        run: cargo build --release --locked -p pd

      - name: Verify pd is 2.0.6 and has migrate-restart
        run: |
          set -euo pipefail
          BIN=target/release/pd
          "$BIN" --version
          "$BIN" --version 2>&1 | grep -q '2\.0\.6' || { echo "pd is not 2.0.6"; exit 1; }
          "$BIN" migrate-restart --help >/dev/null 2>&1 || { echo "migrate-restart subcommand missing"; exit 1; }
          echo "OK: pd 2.0.6 with migrate-restart"

      - name: Assemble release bundle
        id: bundle
        run: |
          set -euo pipefail
          VER="$("target/release/pd" --version | awk '{print $2}')"
          NAME="pd-recovery-${VER}-x86_64-linux-gnu"
          mkdir -p "dist/$NAME"
          cp target/release/pd "dist/$NAME/pd"
          # Reference genesis + operator material shipped on the branch.
          cp restart/candidate-genesis-penumbra-1-restart-12598601-disable.json "dist/$NAME/"
          cp restart/RELEASE-SHA256SUMS        "dist/$NAME/" || true
          cp restart/validator-map.tsv         "dist/$NAME/" || true
          cp restart/penumbra-restart.sh       "dist/$NAME/"
          cp restart/README.md                 "dist/$NAME/"
          cp restart/recovery-runbook.md       "dist/$NAME/" || true
          cp restart/coordination.md           "dist/$NAME/" || true
          cp restart/upgrade-process.md        "dist/$NAME/" || true
          cp restart/pd-migrate-restart-v2.0.6.src.patch "dist/$NAME/" || true
          chmod +x "dist/$NAME/pd" "dist/$NAME/penumbra-restart.sh"

          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          ( cd dist && sha256sum "$NAME.tar.gz" "$NAME/pd" \
              "$NAME/candidate-genesis-penumbra-1-restart-12598601-disable.json" \
              > SHA256SUMS )
          echo "--- SHA256SUMS ---"; cat dist/SHA256SUMS

          # Confirm the shipped genesis matches the published hash.
          GOT="$(sha256sum "dist/$NAME/candidate-genesis-penumbra-1-restart-12598601-disable.json" | awk '{print $1}')"
          [ "$GOT" = "$GENESIS_SHA256" ] || { echo "shipped genesis sha mismatch: $GOT"; exit 1; }
          echo "genesis matches published hash"

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "ver=$VER"   >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: pd-recovery
          path: |
            dist/${{ steps.bundle.outputs.name }}.tar.gz
            dist/SHA256SUMS

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: ${{ steps.tag.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          NAME: ${{ steps.bundle.outputs.name }}
          VER: ${{ steps.bundle.outputs.ver }}
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/notes.md"
          cat > "$NOTES" <<EOF
          # penumbra-1 coordinated restart — pd ${VER} (\`migrate-restart\`)

          penumbra-1 halted at height **12598600**. This continues the **same
          chain-id** — all balances and delegations preserved — by disabling the
          two departed validators (iqlusion, polkachu) and keeping the other 14.

          **Verify, do not trust.** The cross-check is that your own
          \`pd migrate-restart\` reproduces the exact genesis hash below — not this
          binary. Reproduce the binary: \`cargo build --release --locked -p pd\` on
          this tag (or apply \`restart/pd-migrate-restart-v2.0.6.src.patch\` to
          stock v2.0.6 \`f833ace\`). Built on ubuntu-22.04 (glibc 2.35), x86_64-linux-gnu.

          - **genesis sha256:** \`${GENESIS_SHA256}\`
          - **app_hash / post_root:** \`95c5f00d71e5030c5ab7307727544c1d908002b6380786753da709a634da6a4a\`

          ## What each validator does

          The script \`restart/penumbra-restart.sh\` walks all of this as confirmed
          steps (detects your homes, refuses on mismatch). Manual equivalent:

          \`\`\`sh
          # 0. Get pd 2.0.6 + migrate-restart (this release's binary, or build from source above).
          #    STOP your old pd AND cometbft. Do NOT start any old-chain node again.
          # 1. Back up signing state + snapshot the node:
          cp -a node0/cometbft/data/priv_validator_state.json /safe/pvs.json
          #    (zfs snapshot / full copy of node0 recommended)
          # 2. Migrate (ulimit -n high; ~10s):
          ulimit -n 1048576
          pd migrate-restart --home node0/pd --comet-home node0/cometbft \\
            --remove 3969C0511C6ABE474757FEAB7C1B4004796D7E72 \\
            --remove 9B2D4391131198750FF28EE73EC953ECFCFD06EF \\
            --disable
          # 3. VERIFY the produced genesis — MUST equal the sha above, or stop:
          sha256sum node0/cometbft/config/genesis.json
          # 4. Reset cometbft data, then RESTORE signing state (tombstone guard):
          cometbft unsafe-reset-all --home node0/cometbft
          cp -a /safe/pvs.json node0/cometbft/data/priv_validator_state.json
          # 5. config.toml: persistent_peers = KEEP validators only, pex = false (first blocks).
          # 6. Start pd (this binary), then cometbft, in the go-window.
          \`\`\`

          **Only hard rule:** stop your old node before starting the migrated one
          (running both = double-sign = tombstone). **If you're late**, just do
          steps 0–6 whenever and your node will sync to the tip and resume signing —
          you don't need to hit the go-window exactly. RPC/full nodes run steps 0–3
          (skip the pvs restore) to follow the chain.

          Expect ~3 timeout rounds (~1 min) before block 12598601 lands, since keys
          already signed rounds 0–2 at that height. See \`restart/README.md\`.
          EOF
          gh release create "$TAG" \
            --target "${{ github.sha }}" \
            --title "penumbra-1 recovery — pd ${VER}" \
            --notes-file "$NOTES" \
            "dist/${NAME}.tar.gz" \
            "dist/SHA256SUMS" \
            "dist/${NAME}/pd" \
            "dist/${NAME}/candidate-genesis-penumbra-1-restart-12598601-disable.json"
