[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.28.0"
# CI backends to support
ci = "github"
# The archive format to use for non-windows builds (defaults .tar.xz)
unix-archive = ".tar.gz"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
# The installers to generate for each app
installers = ["shell"]
# Which actions to run on pull requests
# "skip" on pull requests: only `dist plan` runs. To test a release build
# without publishing, set "upload" on the PR (see #38).
pr-run-mode = "skip"
# Skip checking whether the specified configuration files are up to date
allow-dirty = ["ci"]
# Whether to install an updater program
install-updater = false
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Build only the required packages, and individually
precise-builds = true

# GitHub-hosted runners that are free for public repositories. BuildJet is
# no longer used by penumbrafi, and the macos-*-large runners are a paid tier.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-unknown-linux-gnu = "ubuntu-22.04"
aarch64-unknown-linux-gnu = "ubuntu-22.04-arm"
